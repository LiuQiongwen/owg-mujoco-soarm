# ─── CoACD object set (added 2026-08-06) ──────────────────────────────────────
# Expansion set for the object-generalization study. Distinct from the entries
# above: collision geometry is a CoACD convex DECOMPOSITION (multiple parts,
# one <geom> each) rather than a single V-HACD hull, which is the only way a
# concave object gets concave contact behaviour -- measured on PowerDrill, the
# single V-HACD hull encloses 100.5% of the true convex-hull volume (i.e. it
# fills in the trigger guard entirely) vs CoACD's 45.0%.
#
# mass:     YCB OFFICIAL MEASURED values, read from each object's own
#           tango_robot/assets/ycb_objects/Ycb*/model.urdf <mass value=...>.
#           Verified to match this file's pre-existing entries wherever they
#           overlap, confirming they are the official figures.
# friction: ESTIMATES, as everywhere else in this file -- YCB publishes no
#           friction coefficients for any object. The parenthetical is the
#           material rationale for the chosen value, not a measurement.
#
# visual_mesh_path/collision_meshes are repo-relative and BOTH point into
# YCB_Dataset/ycb/: the CoACD parts are only valid in the frame of that tree's
# own textured.obj (they sit 2-9 cm away from YCB_ROOT's *_reoriented.obj).

  BananaC:
    pool_name:        YcbBanana
    visual_mesh_path: YCB_Dataset/ycb/banana/textured.obj
    collision_meshes:   # CoACD, 4 part(s)
      - YCB_Dataset/ycb/banana/textured_coacd_0.stl
      - YCB_Dataset/ycb/banana/textured_coacd_1.stl
      - YCB_Dataset/ycb/banana/textured_coacd_2.stl
      - YCB_Dataset/ycb/banana/textured_coacd_3.stl
    mass:             0.166          # kg -- YCB OFFICIAL MEASURED
    friction:         [2.0, 0.05, 0.01]   # ESTIMATE (smooth waxy skin)
    scale:            1.0
    spawn_z_offset:   0.12

  CrackerBoxC:
