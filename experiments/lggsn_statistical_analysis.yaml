# MVP2 execute-flow experiment for the TANGO Experiment Agent
# (research_agent.execute_flow / `execute` CLI command).
#
# PHASE 1 (done): the deterministic statistical core -- loader.py,
# alignment.py, statistics.py, tests/test_lggsn_statistical_analysis.py --
# committed at ceb2029. That phase deliberately worked only against
# aggregate metrics and hand-authored pair-level *fixtures* (test data),
# never a real pair_results.jsonl, because no such file existed anywhere
# in this checkout or its git history (confirmed by a filesystem and
# `git log --all` search before Phase 2 began).
#
# PHASE 2 (this revision): obtain the real, per-checkpoint pair_results.jsonl
# for the four core checkpoints (base/nodist/nozrel/full_v2). No preserved
# backup was found, so it is regenerated deterministically by running the
# already-committed standalone evaluator
# (research_agent_pilots/lggsn_suite/evaluator.py) once per checkpoint. That
# evaluator's own module docstring documents it as an
# EXTERNAL_UNRESTRICTED_SUBPROCESS: it deliberately runs outside
# research_agent entirely (torch does not fit inside MVP4's fixed
# RLIMIT_AS=1GB) -- exactly how the already-committed
# eval_outputs/*/metrics.json files were themselves originally produced.
# Consequently the regeneration command itself is NOT one of this spec's
# allowed_executor_commands and is never run through `execute`'s Claude
# executor or any research_agent flow; it was run directly, once, outside
# this harness, and independently verified before being accepted (see
# below). What THIS spec's execute/build-code task covers is committing
# that already-verified output as data, plus a provenance record, under
# research_agent_pilots/lggsn_analysis/pair_results/<checkpoint_name>/ --
# never under research_agent_pilots/lggsn_suite/eval_outputs/, which
# remains a different task's read-only output directory and is still never
# modified by this spec.
#
# Verification performed before accepting the regenerated data (see each
# checkpoint's provenance.json for the concrete values): for all four
# checkpoints, the regenerated metrics.json's `deterministic_digest`
# matched the already-committed, provenance-verified
# eval_outputs/<name>/metrics.json's digest byte-for-byte, and all four
# checkpoints' 582 pair-level records share the exact same
# (query, pos_row_id, neg_row_id) identity set -- so alignment.py's exact
# cross-checkpoint identity requirement is satisfiable across the whole
# core matrix without modification.
#
# PHASE 2 continued: explicitly OUT of scope was actually running McNemar /
# the paired bootstrap / win-tie-loss against the real data, any plots,
# PNG/PDF figures, LaTeX tables, publication tables, or full report
# generation -- that was deferred to a later phase.
#
# PHASE 3 (this revision): that later phase. Computes and reports the real
# paired statistical conclusions for the LGGSN core matrix, from ONLY the
# real, provenance-pinned pair_results.jsonl files committed in Phase 2
# (research_agent_pilots/lggsn_analysis/pair_results/{base,nodist,nozrel,
# full_v2}/pair_results.jsonl) -- never eval_outputs/, grasp_6dof/models/,
# or any dataset/checkpoint file, and no checkpoint is retrained or
# regenerated. New modules: real_analysis.py (the computation + CLI) and
# reporting.py (JSON/CSV/Markdown/manifest formatting only -- no statistics
# computed there). statistics.py gained two additions this phase:
# paired_bootstrap_ci_clustered (a cluster/block bootstrap -- see its
# docstring for why per-pair i.i.d. resampling, added in Phase 1, is not
# valid for LGGSN's cartesian-product pair construction) and
# holm_bonferroni_adjust (family-wise multiple-comparison correction,
# reported alongside -- never instead of -- the raw p-value). Unlike Phase
# 2's evaluator.py regeneration, running real_analysis.py involves no
# torch, no checkpoint loading, and no research experiment -- it is pure,
# deterministic, CPU-only stdlib computation over already-committed JSONL
# files, so (unlike Phase 2's regeneration command) it IS one of this
# spec's allowed_executor_commands below. This spec still never runs it
# automatically as part of `execute` -- `execute` never invokes
# spec.smoke_command (see execute_flow.py's module docstring), and no
# execution/MVP4 field is set on this spec.
#
# PHASE 3 continued: explicitly OUT of scope was any plot, PNG/PDF figure,
# or LaTeX/publication table -- deferred to a later phase.
#
# PHASE 4 (this revision): that later phase, split into two independent
# outputs, both formatted-only from Phase 3's already-computed
# pairwise_comparisons.json (neither recomputes a statistic):
#   * latex_tables.py -- pure stdlib, no extra dependency, deterministic
#     string formatting. Runs (and is tested) exactly like real_analysis.py
#     -- it IS one of this spec's allowed_executor_commands below.
#   * figures.py -- needs matplotlib, which is NOT installed in the
#     research-agent venv this spec's compileall/pytest/real_analysis.py
#     commands run under. Exactly like Phase 2's evaluator.py regeneration,
#     it is therefore run directly via the `tango` conda env (which does
#     have matplotlib) and is deliberately NOT one of this spec's
#     allowed_executor_commands. Its tests use pytest-skipif so the
#     standard `pytest` command in this spec's allowlist still passes
#     cleanly (skip, not fail) without matplotlib -- they were separately,
#     manually verified to actually pass (not just skip) by running
#     `conda run -n tango python -m pytest -q
#     tests/test_lggsn_statistical_analysis.py` before this revision was
#     written; that verification command is itself outside this spec's
#     allowlist for the same reason as evaluator.py.
# PDF/PNG metadata (CreationDate) is pinned to a fixed datetime, never
# datetime.now(), so repeated figures.py runs in the same environment are
# byte-identical -- verified, not merely assumed; see figures.py's
# docstring for the explicit same-environment-only scope of that claim.
# PHASE 4 continued: explicitly OUT of scope was any statistical follow-up
# on the three NOT_SIGNIFICANT comparisons -- deferred to a later phase.
#
# PHASE 5 (this revision): that later phase -- power analysis. Answers,
# for all five comparisons (not just the three null ones, so nothing is
# selectively reported): given the discordant-pair count and effect size
# Phase 3 already computed, was this study's sample size adequate to
# detect that effect at 80% power, and how many more discordant pairs
# would a follow-up need? New modules: power_analysis.py (the computation
# + CLI, reading ONLY outputs/pairwise_comparisons.json, never
# recomputing McNemar's own p-value/discordant counts) and reporting.py
# gained three writer functions (JSON/CSV/Markdown -- same
# formatting-only role as its Phase 3 functions). statistics.py gained
# four additions: mcnemar_exact_rejection_region, mcnemar_power,
# mcnemar_minimum_detectable_proportion, mcnemar_required_n_for_power.
# Unlike _exact_mcnemar_p_value (which uses exact Fraction arithmetic,
# essential for a value this analysis reports as a finding), these use
# float/log-space arithmetic (math.lgamma) -- exact rational arithmetic
# with 2**n for n in the thousands is both computationally infeasible
# (confirmed empirically: an early Fraction-based draft either raised
# OverflowError converting a many-hundred-digit math.comb(n, k) to float,
# or, for the rejection-region search alone, took too long) and
# unnecessary for this module's exploratory sample-size questions --
# verified to reproduce _exact_mcnemar_p_value's own significance
# boundary decisions exactly (within float64 precision) by a dedicated
# cross-check test. Like real_analysis.py, power_analysis.py involves no
# torch, no checkpoint loading, no research experiment -- pure
# deterministic CPU-only stdlib computation over an already-committed
# JSON file -- so it IS one of this spec's allowed_executor_commands.
# smoke_command below is unchanged from Phase 1-4: a harmless liveness
# placeholder that writes one bool to metrics.json so the separate `smoke`
# flow's deterministic artifact contract stays satisfiable -- it is NOT
# the analysis suite and is never run by `execute`.

task_id: lggsn_statistical_analysis
goal: >
  Phase 5 only (Phases 1-4 are unchanged by this phase, including
  outputs/pairwise_comparisons.json, whose discordant counts and p-values
  this phase only reads, never recomputes): implement
  research_agent_pilots/lggsn_analysis/power_analysis.py, computing, for
  all five planned comparisons, an exact (float/log-space, not the
  headline exact-Fraction McNemar p-value's arithmetic) power analysis
  from each comparison's already-computed discordant-pair counts: the
  observed proportion of discordant pairs favoring checkpoint B; post-hoc
  power to detect that observed effect at alpha=0.05 (reported with an
  explicit caveat that post-hoc power is a monotonic rescaling of the
  p-value, not independent evidence); the minimum proportion this
  particular study's actual discordant-pair count could detect at 80%
  power; and the number of discordant pairs that would be required to
  detect the observed effect at 80% power (None, with an explicit note,
  if the observed effect is exactly null or the requirement exceeds a
  bounded search). Add mcnemar_exact_rejection_region, mcnemar_power,
  mcnemar_minimum_detectable_proportion, and
  mcnemar_required_n_for_power to statistics.py, and three writer
  functions (write_power_analysis_json/csv/markdown) to reporting.py.
  Write research_agent_pilots/lggsn_analysis/outputs/power_analysis.json,
  power_analysis.csv, and power_analysis.md. Update
  tests/test_lggsn_statistical_analysis.py with coverage for: the new
  rejection-region/power functions cross-checked against the existing
  exact McNemar p-value at and around the significance boundary; power
  increasing monotonically with effect size; no overflow/hang for large n
  (the bug this phase's design deliberately fixed); the null-proportion
  and search-bound-exceeded None cases; that every NOT_SIGNIFICANT
  comparison's post-hoc power is documented as below 80% (the real
  finding motivating this phase) and every significant comparison's
  post-hoc power is not trivially low; determinism; and JSON/CSV
  agreement. Do not modify research_agent_pilots/lggsn_suite/
  eval_outputs/, grasp_6dof/models/, checkpoints/, causal_validity_audit/,
  research_agent/, or any paper file. Do not retrain or regenerate any
  checkpoint, and do not recompute or alter any statistic Phase 3 already
  computed -- this phase only ever reads outputs/pairwise_comparisons.json.

allowed_paths:
  - research_agent_pilots/lggsn_analysis
  - tests
  - experiments

forbidden_paths:
  - research_agent
  - causal_validity_audit
  - grasp_6dof/models
  - data
  - datasets
  - results
  - checkpoints
  - paperA_data
  - paper_final.tex
  - paper_final.pdf
  - paper_advanced_robotics.tex
  - paper_tro.tex
  - paper_tro.pdf
  - paper_tro_draft.md
  - paper_draft.md
  - paper_risk_gated_vla_draft.md
  - tango_robot

allowed_modify_paths:
  - research_agent_pilots/lggsn_analysis
  - tests
  - experiments/lggsn_statistical_analysis.yaml

# Phase 5 adds power_analysis.py (source, small), reporting.py/statistics.py
# additions, a larger tests/ update, and three small generated files under
# outputs/ (power_analysis.{json,csv,md}, all plain text, a few KB total) --
# no images this time, so the byte budget barely needs to move; kept at
# Phase 4's level since there is ample headroom already.
max_changed_files: 40
max_changed_bytes: 3000000

# The only five commands this task may run, byte-for-byte, as argv arrays
# (never a shell string). The first, second, and fifth are already covered
# by MVP2's own fixed executor allowlist
# (research_agent.policies.execution_policy._FIXED_ALLOWLIST_EXACT /
# ._FIXED_ALLOWLIST_PREFIXES / ._PYTEST_PREFIX); they are listed here
# explicitly so the spec is self-documenting about the exact bound, not
# because the fixed allowlist would otherwise reject them. The third
# (real_analysis.py, Phase 3) and fourth (power_analysis.py, this phase)
# are both pure, deterministic, CPU-only stdlib computation over
# already-committed JSON/JSONL files -- no torch, no checkpoint/dataset
# access, no research experiment -- so both are allowed_executor_commands.
# latex_tables.py (Phase 4, also pure stdlib) would be exactly as safe to
# add here, but stays deliberately absent for the same reason it always
# has been: this spec's execute/build-code task is to create the module,
# not to also run it as part of `execute` (it was run directly, once, to
# produce the committed outputs/tables/ files -- see the Phase 4 header
# comment above). figures.py (matplotlib) remains absent for the reason
# given in its own header comment (not installed in this spec's own
# compileall/pytest/real_analysis.py/power_analysis.py environment).
allowed_executor_commands:
  - - python
    - "-m"
    - compileall
    - "-q"
    - research_agent_pilots/lggsn_analysis
    - tests
  - - python
    - "-m"
    - pytest
    - "-q"
    - tests/test_lggsn_statistical_analysis.py
  - - python
    - "-m"
    - research_agent_pilots.lggsn_analysis.real_analysis
    - "--repo-root"
    - "."
    - "--output-dir"
    - research_agent_pilots/lggsn_analysis/outputs
  - - python
    - "-m"
    - research_agent_pilots.lggsn_analysis.power_analysis
    - "--comparisons-json"
    - research_agent_pilots/lggsn_analysis/outputs/pairwise_comparisons.json
    - "--output-dir"
    - research_agent_pilots/lggsn_analysis/outputs
  - - git
    - diff
    - "--check"

# Static checks the harness independently runs after implementation:
# "compileall" (built from spec.allowed_paths) and the one committed pytest
# target below.
required_executor_checks:
  - compileall
  - "pytest:tests/test_lggsn_statistical_analysis.py"

# `execute` never runs this command (see execute_flow.py's module
# docstring) -- it exists only to keep this spec internally consistent as a
# general ExperimentSpec/task contract, since research_agent.tasks
# .verification.verify_artifacts (used by the separate `smoke` flow)
# unconditionally requires artifacts/metrics.json to exist regardless of
# whether required_metrics is empty. A no-op `python -c pass` smoke_command
# can never satisfy that, so deterministic smoke verification would always
# fail; this command exists solely to make that check pass and carries NO
# scientific meaning -- it is a build-task liveness smoke check only, never
# the statistical-analysis suite itself and never a result to cite.
smoke_command:
  - python
  - "-c"
  - |
    import json
    import os

    artifacts_dir = os.environ["RESEARCH_AGENT_ARTIFACTS_DIR"]
    metrics = {"implementation_smoke_ok": True}
    out_path = os.path.join(artifacts_dir, "metrics.json")
    with open(out_path, "w") as f:
        json.dump(metrics, f)

confirmatory_command: null

seeds: [0]

timeouts:
  planner_seconds: 60
  executor_seconds: 300
  smoke_seconds: 30
  verifier_seconds: 60
  reviewer_seconds: 60

# Not a scientific result -- just confirms the smoke_command above ran and
# wrote its artifact, satisfying verify_artifacts's unconditional
# metrics.json requirement.
required_metrics:
  - name: implementation_smoke_ok
    type: bool

approval:
  required_for_confirmatory: true
  approved_by: null

max_run_count: 10
